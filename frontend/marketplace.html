<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Agro Linken</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <div class="logo">🌾 Agro Linken</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <div class="container">
        <h1 style="margin-bottom: 2rem; color: var(--primary-color);">Marketplace</h1>
        
        <div class="grid" id="market-grid">
            <!-- Products injected here -->
        </div>
    </div>

    <!-- Purchase Modal -->
    <div id="purchase-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3 id="modal-title">Buy Product</h3>
            <p id="modal-desc" style="margin-bottom: 1rem;"></p>
            <div class="form-group">
                <label>Quantity to Buy (kg)</label>
                <input type="number" id="buy-quantity" placeholder="10">
            </div>
            <button class="btn" onclick="confirmPurchase()">Place Order</button>
            <button class="btn btn-secondary" onclick="hidePurchaseModal()">Cancel</button>
        </div>
    </div>

    <script src="scripts/api.js"></script>
    <script>
        const user = requireAuth();
        let currentProduct = null;

        loadMarketplace();

        async function loadMarketplace() {
            try {
                const products = await api.getAllProducts();
                const grid = document.getElementById('market-grid');
                grid.innerHTML = products.map(p => `
                    <div class="card">
                        <div class="card-img" style="background-color: var(--secondary-color); color: white;">🚜</div>
                        <div class="card-body">
                            <span class="tag">${p.category}</span>
                            <h3 class="card-title" style="margin-top: 0.5rem;">${p.name}</h3>
                            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">
                                Sold by: ${p.farmer.name} (${p.farmer.location})
                            </p>
                            <div class="card-price">₹${p.price} <span style="font-size:0.9rem;color:#666">/ kg</span></div>
                            <div class="card-meta"><span>Available: ${p.quantity}kg</span></div>
                            
                            ${user.role === 'BUYER' ? `
                                <button class="btn" style="width:100%; margin-top: 1rem;" 
                                    onclick='openPurchaseModal(${JSON.stringify(p).replace(/'/g, "&apos;")})'
                                    ${p.quantity === 0 ? 'disabled' : ''}>
                                    ${p.quantity === 0 ? 'Out of Stock' : 'Buy Now'}
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        function openPurchaseModal(product) {
            currentProduct = product;
            document.getElementById('modal-title').innerText = `Buy ${product.name}`;
            document.getElementById('modal-desc').innerText = `Price: ₹${product.price}/kg. Available: ${product.quantity}kg`;
            document.getElementById('purchase-modal').classList.remove('hidden');
        }

        function hidePurchaseModal() {
            document.getElementById('purchase-modal').classList.add('hidden');
            currentProduct = null;
        }

        async function confirmPurchase() {
            const qty = parseInt(document.getElementById('buy-quantity').value);
            if (!qty || qty <= 0 || qty > currentProduct.quantity) {
                alert('Invalid quantity');
                return;
            }

            try {
                const orderData = {
                    buyer: { id: user.id },
                    product: { id: currentProduct.id },
                    quantity: qty
                };
                await api.placeOrder(orderData);
                alert('Order placed successfully!');
                hidePurchaseModal();
                loadMarketplace();
            } catch(err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
