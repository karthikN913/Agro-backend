<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages – Agro Linken</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header>
    <a class="logo notranslate" href="dashboard.html">🌾 Agro<span>Linken</span></a>
    <nav>
      <a href="dashboard.html" data-i18n="nav_dashboard">📊 Dashboard</a>
      <a href="marketplace.html" data-i18n="nav_marketplace">🛍️ Marketplace</a>
      <a href="community.html" data-i18n="nav_community">💬 Community</a>
      <a href="schemes.html" data-i18n="nav_schemes">🏛️ Schemes</a>
      <a href="#" onclick="logout()" data-i18n="nav_logout">🚪 Logout</a>
      <select class="lang-selector notranslate" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="hi">हिंदी (Hindi)</option>
        <option value="bn">বাংলা (Bengali)</option>
        <option value="te">తెలుగు (Telugu)</option>
        <option value="mr">मराठी (Marathi)</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="ur">اردو (Urdu)</option>
        <option value="gu">ગુજરાતી (Gujarati)</option>
        <option value="kn">ಕನ್ನಡ (Kannada)</option>
        <option value="ml">മലയാളം (Malayalam)</option>
        <option value="or">ଓଡ଼ିଆ (Odia)</option>
        <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
        <option value="as">অসমীয়া (Assamese)</option>
        <option value="mai">मैथिली (Maithili)</option>
        <option value="gom">कोंकणी (Konkani)</option>
        <option value="sa">संस्कृतम् (Sanskrit)</option>
      </select>
      <div id="google_translate_element" style="display:none;"></div>
    </nav>
  </header>

  <div class="chat-layout">
    <!-- Chat Sidebar -->
    <div class="chat-sidebar">
      <div class="chat-sidebar-header">💬 Messages</div>
      <div class="chat-search-container">
        <input type="search" id="user-search" class="chat-search-input" placeholder="🔍 Search users..." oninput="searchUsers()">
      </div>
      <div class="chat-list" id="chat-list">
        <div style="padding:2rem;text-align:center;color:var(--text-muted);font-size:0.9rem;">Loading users...</div>
      </div>
    </div>

    <!-- Chat Window -->
    <div class="chat-window" id="chat-window">
      <!-- Empty State -->
      <div id="chat-empty-state" class="chat-empty-state">
        <div class="chat-empty-icon">💬</div>
        <h3 class="chat-empty-title">Select a conversation</h3>
        <p class="chat-empty-text">Choose a farmer or buyer from the left to start chatting</p>
      </div>

      <!-- Active Chat (hidden by default) -->
      <div id="active-chat" style="display:none;flex-direction:column;height:100%;">
        <div class="chat-window-header">
          <div class="chat-avatar" id="chat-peer-avatar">?</div>
          <div>
            <div style="font-weight:700;" id="chat-peer-name">–</div>
            <div style="font-size:0.8rem;color:var(--text-muted);" id="chat-peer-role">–</div>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
          <textarea class="chat-input" id="chat-input-field" placeholder="Type a message..." rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
          <button class="chat-send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/api.js"></script>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'hi,bn,te,mr,ta,ur,gu,kn,ml,or,pa,as,mai,gom,sa', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <!-- SockJS + STOMP for WebSocket -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

  <script>
    const user = requireAuth();
    let stompClient = null;
    let currentPeer = null;
    let allUsers = [];

    connectWebSocket();
    loadUsers();

    function connectWebSocket() {
      const socket = new SockJS(`${API_BASE_URL.replace('/api', '')}/ws-chat`);
      stompClient = Stomp.over(socket);
      stompClient.debug = null; // suppress logs
      stompClient.connect({}, function() {
        stompClient.subscribe('/topic/public', function(msg) {
          const message = JSON.parse(msg.body);
          if (currentPeer && (message.sender?.id == currentPeer.id || message.receiver?.id == currentPeer.id)) {
            appendMessage(message, false);
          }
        });
      }, function(err) { console.warn('WebSocket connection failed:', err); });
    }

    async function loadUsers() {
      try {
        allUsers = (await api.getAllUsers()).filter(u => u.id !== user.id);
        renderUserList(allUsers);
      } catch(e) {
        document.getElementById('chat-list').innerHTML = '<div style="padding:1.5rem;text-align:center;color:var(--text-muted);font-size:0.85rem;">Connect with farmers and buyers by visiting the marketplace.</div>';
      }
    }

    function renderUserList(users) {
      const list = document.getElementById('chat-list');
      if (users.length === 0) { list.innerHTML = '<div style="padding:1.5rem;text-align:center;color:var(--text-muted);">No other users found.</div>'; return; }
      const roleMap = { FARMER: '🌾 Farmer', BUYER: '🛒 Buyer', SHOP_OWNER: '🏪 Shop Owner', TRANSPORTER: '🚚 Transporter', ADMIN: '🛡️ Admin' };
      list.innerHTML = users.map(u => `
        <div class="chat-item ${currentPeer?.id === u.id ? 'active' : ''}" onclick="openChat(${JSON.stringify(u).replace(/"/g,'&quot;')})">
          <div class="chat-avatar">${(u.name || 'U')[0].toUpperCase()}</div>
          <div class="chat-item-info">
            <div class="chat-item-name">${u.name || 'Unknown'}</div>
            <div class="chat-item-preview">${roleMap[u.role] || u.role} · ${u.location || ''}</div>
          </div>
        </div>
      `).join('');
    }

    function searchUsers() {
      const q = document.getElementById('user-search').value.toLowerCase();
      renderUserList(allUsers.filter(u => (u.name || '').toLowerCase().includes(q) || (u.location || '').toLowerCase().includes(q)));
    }

    async function openChat(peer) {
      currentPeer = peer;
      const roleMap = { FARMER: '🌾 Farmer', BUYER: '🛒 Buyer', SHOP_OWNER: '🏪 Shop Owner', TRANSPORTER: '🚚 Transporter' };
      document.getElementById('chat-peer-avatar').textContent = (peer.name || 'U')[0].toUpperCase();
      document.getElementById('chat-peer-name').textContent = peer.name || 'Unknown';
      document.getElementById('chat-peer-role').textContent = `${roleMap[peer.role] || peer.role} · ${peer.location || ''}`;
      document.getElementById('chat-empty-state').style.display = 'none';
      const activeChat = document.getElementById('active-chat');
      activeChat.style.display = 'flex';
      renderUserList(allUsers); // refresh active highlight

      // Load chat history
      try {
        const messages = await api.getMessages(user.id, peer.id);
        const msgContainer = document.getElementById('chat-messages');
        msgContainer.innerHTML = '';
        messages.forEach(m => appendMessage(m, false));
        msgContainer.scrollTop = msgContainer.scrollHeight;
      } catch(e) { console.error(e); }
    }

    function appendMessage(msg, scroll = true) {
      const isSent = msg.sender?.id == user.id || msg.sender == user.id;
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.innerHTML = `
        <div class="message-wrapper ${isSent ? 'sent' : 'received'}">
          <div class="message-bubble ${isSent ? 'sent' : 'received'}">${escapeHtml(msg.content)}</div>
          <div class="message-time">${formatTime(msg.timestamp)}</div>
        </div>`;
      container.appendChild(div);
      if (scroll) container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('chat-input-field');
      const content = input.value.trim();
      if (!content || !currentPeer || !stompClient?.connected) return;
      const message = {
        sender: { id: user.id },
        receiver: { id: currentPeer.id },
        content: content,
        timestamp: new Date().toISOString()
      };
      stompClient.send('/app/chat.sendMessage', {}, JSON.stringify(message));
      appendMessage({ ...message, sender: user });
      input.value = '';
    }

    function escapeHtml(text) {
      return String(text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatTime(ts) {
      if (!ts) return '';
      try { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch(e) { return ''; }
    }
  </script>
</body>
</html>
