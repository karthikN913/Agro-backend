server.port=8080
server.address=0.0.0.0

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── HikariCP Connection Pool Tuning ───────────────────────────────────────────
# Keeps connections warm so every request doesn't pay reconnect latency.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
# Keepalive query prevents idle connections from being dropped by Render/cloud proxies.
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── Hibernate Performance Settings ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Batch inserts/updates: sends multiple rows to DB in one round-trip.
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Second-level cache (query result cache) using in-process Ehcache.
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
# Reduce SQL parsing overhead by caching prepared statements.
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# ── Logging (suppress noisy Hibernate SQL in production) ─────────────────────
spring.jpa.show-sql=false

# Firebase
firebase.service-account-path=serviceAccountKey.json
