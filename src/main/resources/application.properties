server.port=8080
server.address=0.0.0.0

# ── PostgreSQL / Supabase Database Configuration ──────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── HikariCP Connection Pool Tuning (Optimized for Supabase & Render) ─────────
# Supabase pgBouncer drops idle connections after 60-300 seconds.
# Keep max-lifetime shorter than Supabase idle timeout to prevent stale connection errors on Render.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── Hibernate Performance Settings ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Batch inserts/updates: sends multiple rows to DB in one round-trip.
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Disable L2 cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
# Statement batching keys
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# ── Logging ───────────────────────────────────────────────────────────────────
spring.jpa.show-sql=false

# Firebase
firebase.service-account-path=serviceAccountKey.json
